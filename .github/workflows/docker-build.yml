name: Build and Push JARVIS XR Docker Images to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Name
        id: repo-name
        run: |
          echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build & Push: Backend (FastAPI)
      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.repo-name.outputs.repo }}/jarvis-backend:latest
            ghcr.io/${{ steps.repo-name.outputs.repo }}/jarvis-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=JARVIS XR Backend
            org.opencontainers.image.description=Backend determinístico FastAPI para o JARVIS XR
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # 2. Build & Push: Frontend (Three.js / WebXR)
      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.repo-name.outputs.repo }}/jarvis-frontend:latest
            ghcr.io/${{ steps.repo-name.outputs.repo }}/jarvis-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=JARVIS XR Frontend
            org.opencontainers.image.description=Interface tridimensional WebXR Three.js para o Meta Quest 3S
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

