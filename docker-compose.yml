services:
  jarvis-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jarvis-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - jarvis-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  jarvis-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jarvis-frontend
    restart: unless-stopped
    networks:
      - jarvis-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  jarvis-proxy:
    image: caddy:2.8.4-alpine
    container_name: jarvis-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - JARVIS_DOMAIN=${JARVIS_DOMAIN:-jarvis.homelab.local}
      - CADDY_TLS_MODE=${CADDY_TLS_MODE:-internal}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - jarvis-net
    depends_on:
      jarvis-backend:
        condition: service_healthy
      jarvis-frontend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  jarvis-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

