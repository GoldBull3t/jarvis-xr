# ==============================================================================
# JARVIS XR — COMPOSE PARA COSMOS CLOUD (SERVAPP)
# Utiliza as imagens pré-compiladas automaticamente pelo GitHub Actions (GHCR)
# ==============================================================================

version: '3.8'

services:
  jarvis-backend:
    image: ghcr.io/goldbull3t/jarvis-backend:latest
    container_name: jarvis-backend
    restart: unless-stopped
    environment:
      - JARVIS_ENV=production
      - JARVIS_LOG_LEVEL=INFO
      # Autenticação: Defina 'false' para acesso direto na sua rede local privada (sem pedir token)
      # Ou defina 'true' e preencha uma JARVIS_API_KEY à sua escolha
      - JARVIS_AUTH_ENABLED=false
      - JARVIS_API_KEY=
      # Domínio próprio personalizado (opcional - deixe vazio para deteção dinâmica pelo Cosmos Cloud)
      - JARVIS_DOMAIN=
      - JARVIS_CORS_ORIGINS=*

      # Integração Proxmox VE
      - PROXMOX_ENABLED=true
      - PROXMOX_URL=https://192.168.1.100:8006
      - PROXMOX_TOKEN_ID=jarvis-monitoring@pve!jarvis-token
      - PROXMOX_TOKEN_SECRET=00000000-0000-0000-0000-000000000000
      - PROXMOX_VERIFY_SSL=false
      - PROXMOX_TIMEOUT_SECONDS=10
      - PROXMOX_ALLOWED_VMIDS=101,102

      # Integração Home Assistant
      - HOME_ASSISTANT_ENABLED=true
      - HOME_ASSISTANT_URL=https://ha.bernaslab.top
      # URL de contingência opcional (comuta automaticamente se o domínio primário falhar):
      - HOME_ASSISTANT_FALLBACK_URL=http://192.168.30.237:8123
      - HOME_ASSISTANT_TOKEN=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      - HOME_ASSISTANT_TIMEOUT_SECONDS=5
      - HOME_ASSISTANT_VERIFY_SSL=false
      - HOME_ASSISTANT_DISCOVERY_MODE=labels
      - HOME_ASSISTANT_DISCOVERY_LABEL=jarvis
      # Descoberta por divisão/área opcional:
      - HOME_ASSISTANT_DISCOVERY_AREAS=
      - HOME_ASSISTANT_PRESENCE_ENTITY=input_boolean.jarvis_xr_active
      - HOME_ASSISTANT_ALLOWED_ENTITIES=light.escritorio,switch.tomada_servidor

      # Integração DNS Shield (opções: "pihole", "adguard", ou "none")
      - DNS_PROVIDER=none
      - PIHOLE_URL=http://192.168.1.120:80
      - PIHOLE_API_TOKEN=
      - ADGUARD_URL=http://192.168.1.120:3000
      - ADGUARD_USERNAME=admin
      - ADGUARD_PASSWORD=

      # Allowlist de Serviços do Homelab
      - HOMELAB_SERVICES=[{"name":"Proxmox VE","url":"https://192.168.30.123:8006"},{"name":"Home Assistant","url":"https://ha.bernaslab.top"}]
    # Resolução DNS e mapeamento de hosts para domínios locais do Homelab
    dns:
      - 192.168.10.1
      - 1.1.1.1
    extra_hosts:
      - "ha.bernaslab.top:192.168.30.237"
    networks:
      - cosmos-network

  jarvis-frontend:
    image: ghcr.io/goldbull3t/jarvis-frontend:latest
    container_name: jarvis-frontend
    restart: unless-stopped
    depends_on:
      - jarvis-backend
    networks:
      - cosmos-network

networks:
  cosmos-network:
    external: true
    name: cosmos-network

